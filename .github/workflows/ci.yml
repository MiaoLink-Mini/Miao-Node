name: Node CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 'Explicit Miao-Backend commit, tag or branch'
        type: string
        required: true
        default: '8aafd1015c7c00befa4227c9eeb68027b3e0c253'
      frontend_ref:
        description: 'Explicit Miao-Frontend commit, tag or branch'
        type: string
        required: true
        default: '00a2650f4bf3d320ca26282cd759a96c1a56edb0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '24.1.0'
          - os: ubuntu-24.04
            node: '24'
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    defaults:
      run:
        shell: bash
        working-directory: WeAgent-Node
    steps:
      - name: Check out Node under its source-compatible directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: WeAgent-Node
          persist-credentials: false

      - name: Check out the canonical Gateway contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MiaoLink-Mini/Miao-Backend
          ref: ${{ inputs.backend_ref || '8aafd1015c7c00befa4227c9eeb68027b3e0c253' }}
          path: WeAgent-Backend
          persist-credentials: false

      - name: Check out the frontend referenced by the example configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MiaoLink-Mini/Miao-Frontend
          ref: ${{ inputs.frontend_ref || '00a2650f4bf3d320ca26282cd759a96c1a56edb0' }}
          path: WeAgent-Frontend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: WeAgent-Node/package-lock.json

      - name: Record the exact runtime and source revisions
        run: |
          {
            printf '### Unit / Node %s\n\n' "$(node --version)"
            printf -- '- Node: `%s`\n' "$(git rev-parse HEAD)"
            printf -- '- Backend: `%s`\n' "$(git -C ../WeAgent-Backend rev-parse HEAD)"
            printf -- '- Frontend: `%s`\n' "$(git -C ../WeAgent-Frontend rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run every unit test without contacting real Agents
        # Bash expands this glob consistently on Linux, Windows and macOS.
        # It is the same test entry point as package.json's npm test.
        run: node --test tests/*.test.mjs

  integration:
    name: Native fixtures / Go Gateway / PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: weagent
          POSTGRES_PASSWORD: golink-ci-only
          POSTGRES_DB: golink_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weagent -d golink_integration"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # A new service database exists only for this job.
      DATABASE_URL: postgres://weagent:golink-ci-only@127.0.0.1:5432/golink_integration?sslmode=disable
      AUTH_MODE: development
      LISTEN_ADDR: 127.0.0.1:18080
      COMMAND_TTL: 15s
      WEAGENT_TEST_GATEWAY: http://127.0.0.1:18080
    defaults:
      run:
        shell: bash
        working-directory: WeAgent-Node
    steps:
      - name: Check out Node
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: WeAgent-Node
          persist-credentials: false

      - name: Check out the Gateway version under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MiaoLink-Mini/Miao-Backend
          ref: ${{ inputs.backend_ref || '8aafd1015c7c00befa4227c9eeb68027b3e0c253' }}
          path: WeAgent-Backend
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: WeAgent-Node/package-lock.json

      - name: Set up the Gateway toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: WeAgent-Backend/go.mod
          cache-dependency-path: WeAgent-Backend/go.sum

      - name: Record the integration source revisions
        run: |
          {
            printf '### Native fixture integration\n\n'
            printf -- '- Node: `%s`\n' "$(git rev-parse HEAD)"
            printf -- '- Backend: `%s`\n' "$(git -C ../WeAgent-Backend rev-parse HEAD)"
            printf -- '- Runtime: `%s`; `%s`\n' "$(node --version)" "$(go version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download and verify Gateway modules
        working-directory: WeAgent-Backend
        run: |
          go mod download
          go mod verify

      - name: Run existing native fixtures against an isolated real Gateway
        run: |
          build_dir="$(mktemp -d "$RUNNER_TEMP/golink-integration.XXXXXX")"
          gateway_pid=""

          cleanup() {
            status=$?
            trap - EXIT INT TERM
            set +e
            if [[ -n "$gateway_pid" ]]; then
              if kill -0 "$gateway_pid" 2>/dev/null; then
                kill -TERM "$gateway_pid" 2>/dev/null
                for ((i=0; i<50; i++)); do
                  kill -0 "$gateway_pid" 2>/dev/null || break
                  sleep 0.1
                done
                if kill -0 "$gateway_pid" 2>/dev/null; then
                  kill -KILL "$gateway_pid" 2>/dev/null
                fi
              fi
              wait "$gateway_pid" 2>/dev/null
            fi
            # Do not publish fixture logs, state databases, identities or tokens.
            rm -rf -- "$build_dir"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          (
            cd ../WeAgent-Backend
            go build -trimpath -o "$build_dir/gateway" ./cmd/gateway
            go build -trimpath -o "$build_dir/migrate" ./cmd/migrate
          )

          # This key is disposable and is never written to an artifact.
          GATEWAY_HMAC_KEY="$(node -p "require('node:crypto').randomBytes(32).toString('base64')")"
          export GATEWAY_HMAC_KEY
          "$build_dir/migrate" up
          "$build_dir/gateway" > "$build_dir/gateway.log" 2>&1 &
          gateway_pid=$!

          ready=false
          for ((i=0; i<100; i++)); do
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              echo "::error::The isolated Gateway exited before readiness."
              exit 1
            fi
            if curl --fail --silent --max-time 1 \
              "$WEAGENT_TEST_GATEWAY/readyz" -o "$build_dir/ready.json"; then
              if node -e '
                const fs = require("node:fs");
                try {
                  const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  process.exit(body.status === "ok" ? 0 : 1);
                } catch {
                  process.exit(1);
                }
              ' "$build_dir/ready.json"; then
                ready=true
                break
              fi
            fi
            sleep 0.2
          done
          if [[ "$ready" != true ]]; then
            echo "::error::The isolated Gateway did not become ready."
            exit 1
          fi

          # The existing suite forks native protocol fixtures, not paid Agent CLIs.
          node scripts/integration.mjs
